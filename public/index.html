<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Movie Pinboard</title>
<link rel="icon" href="/assets/cinema/reel.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=DM+Mono&family=Instrument+Sans:wght@400;500;600&family=Rye&display=swap">
<style>
/* Layout: a poster wall. Two boards (one per person) plus a Watched board, as ticket-stub tabs. 2:3 poster cards in a grid; each person has a colour that marks who pinned what. */
:root{
  color-scheme:light;
  --bg:#eee4d2;
  --surface:#fffaf0;
  --surface-2:#e4d5bd;
  --line:#d2bea0;
  --fg:#2b1b17;
  --muted:#2b1b17;
  --accent:#922839;
  --accent-ink:#fff5df;
  --accent-soft:#f1d7d5;
  --ok:#4c6752;
  --ok-ink:#ffffff;
  --danger:#a52c27;
  --pa:#922839;
  --pb:#b77b35;
  --font-display:'Rye',Papyrus,'Hiragino Kaku Gothic Pro',fantasy;
  --font-body:'Instrument Sans',system-ui,sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,monospace;
  --font-hand:'Caveat','Segoe Print','Bradley Hand',cursive;
  --board:#e3cfad;
  --board-dark:#3c2924;
  --paper:#fff8e8;
  --ink:#241613;
  --burgundy:#922839;
  --list-bg:#f7ecd8;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#211816;--surface:#3a2b25;--surface-2:#514037;--line:#71594a;--fg:#f8ead2;--muted:#d0b89b;
    --accent:#d26a70;--accent-ink:#241613;--accent-soft:#67363c;--ok:#79a17e;--ok-ink:#182017;--danger:#ff968d;
    --pa:#d26a70;--pb:#d6a15e;
    --board:#594237;--board-dark:#211716;
    --paper:#3c2c25;--ink:#f8ead2;--burgundy:#e58a88;--list-bg:#4b382e;
  }
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.5 var(--font-body);
  padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(64px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;overflow-x:hidden;
  background-image:linear-gradient(rgb(255 248 232 / .18),rgb(255 248 232 / .18)),url('/assets/cinema/paper.png');
  background-size:auto,cover;
  background-position:center;
  background-attachment:fixed;
}
button{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:18px}
.wrap{position:relative;z-index:1}
#room-rail{
  position:fixed;z-index:3;left:18px;top:50%;transform:translateY(-50%);
  width:150px;padding:12px;background:var(--ink);border:3px solid var(--ink);
  box-shadow:5px 6px 0 rgb(55 33 23 / .2);color:var(--paper);
}
#room-rail h2{margin:0 0 10px;font:700 14px/1 var(--font-display);color:var(--paper);text-align:center}
.room-list{display:flex;flex-direction:column;gap:7px}
.room-choice{
  width:100%;padding:8px 9px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:var(--paper);color:var(--ink);border:2px solid var(--paper);border-radius:2px;
  cursor:pointer;font:600 12px var(--font-body);
}
.room-choice:hover{border-color:var(--accent)}
.room-choice[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.room-add{width:100%;margin-top:9px;padding:7px;background:transparent;color:var(--paper);border:1px dashed var(--paper);cursor:pointer;font-size:12px}
.room-add:hover{background:rgb(255 248 232 / .1)}
.cinema-decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cinema-reel{
  position:absolute;width:clamp(130px,17vw,230px);aspect-ratio:1;opacity:.24;
  border:clamp(9px,1vw,14px) solid var(--ink);border-radius:50%;
  background:
    radial-gradient(circle at 50% 7%,var(--paper) 0 7%,transparent 8%),
    radial-gradient(circle at 93% 34%,var(--paper) 0 7%,transparent 8%),
    radial-gradient(circle at 78% 84%,var(--paper) 0 7%,transparent 8%),
    radial-gradient(circle at 22% 84%,var(--paper) 0 7%,transparent 8%),
    radial-gradient(circle at 7% 34%,var(--paper) 0 7%,transparent 8%),
    radial-gradient(circle,var(--paper) 0 10%,var(--ink) 11% 18%,transparent 19%);
  box-shadow:inset 0 0 0 10px var(--paper),inset 0 0 0 16px var(--ink);
  animation:reel-turn 22s linear infinite;
}
.cinema-reel::before{
  content:"";position:absolute;inset:22%;border:2px solid var(--paper);border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 10%,var(--ink) 10% 14%,transparent 14% 30%,var(--ink) 30% 34%,transparent 34% 50%,var(--ink) 50% 54%,transparent 54% 70%,var(--ink) 70% 74%,transparent 74% 90%,var(--ink) 90% 94%,transparent 94%);
}
.reel-a{top:8%;left:-58px;transform:rotate(18deg)}
.reel-b{right:-70px;bottom:14%;animation-duration:28s;animation-direction:reverse}
@keyframes reel-turn{to{rotate:360deg}}
@media (prefers-reduced-motion:reduce){
  .cinema-reel{animation:none}
}

/* header */
.top{
  width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 16px;
  padding:14px 20px;background:var(--ink);color:var(--paper);
  border:3px solid var(--ink);box-shadow:6px 7px 0 rgb(55 33 23 / .2);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{color:var(--accent-soft);flex:none}
h1{margin:0;font:800 28px/1.1 var(--font-display);letter-spacing:-.02em;text-wrap:balance}
.who{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 12px;font-size:14px;color:var(--paper);min-width:0}
.who strong{color:var(--paper);font-weight:600}
.who .room{font:400 12px var(--font-mono);border:1px solid var(--burgundy);border-radius:999px;padding:2px 10px;color:var(--paper);background:rgb(255 248 232 / .08)}
.who form{display:flex;gap:6px}
.who input{width:140px;padding:6px 10px;background:var(--paper);color:var(--ink);border-color:var(--paper)}
.who .link{color:var(--paper)}
.who .link:hover{color:var(--accent-soft)}
.status{margin:0;color:var(--muted);text-align:center}

/* shared bits */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot-a{background:var(--pa)}
.dot-b{background:var(--pb)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);
  border-radius:2px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;
  box-shadow:3px 4px 0 rgb(55 33 23 / .16);
}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2);filter:none}
.link{background:none;border:0;padding:2px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
.link:hover{color:var(--fg)}
input[type=text],input[type=password],textarea{
  width:100%;background:var(--paper);color:var(--fg);border:2px solid var(--line);
  border-radius:2px;padding:10px 12px;font:inherit;
}
textarea{resize:vertical;min-height:64px}
::placeholder{color:var(--muted);opacity:.8}
svg{display:block}

/* lobby */
.lobby{
  position:relative;width:min(100%,520px);background:var(--paper);border:3px solid var(--ink);
  border-radius:3px;padding:30px;display:flex;flex-direction:column;gap:18px;
  box-shadow:10px 12px 0 rgb(55 33 23 / .2),inset 0 0 0 6px var(--paper);
  transform:rotate(-1deg);
}
.lobby::before{content:"";position:absolute;inset:10px;border:1px solid var(--burgundy);pointer-events:none}
.lobby > *{position:relative;z-index:1}
.lobby h2{margin:0;font:700 22px/1.2 var(--font-display)}
.lobby .lede{margin:0;color:var(--muted)}
.switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
.switch button{border:0;background:none;border-radius:7px;padding:8px 10px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.lobby form{display:flex;flex-direction:column;gap:14px}
.lobby-cancel{align-self:center}
.err{margin:0;color:var(--danger);font-size:14px}

/* fields */
.field{display:flex;flex-direction:column;gap:6px;border:0;padding:0;margin:0;min-width:0}
.field label,.field legend{font:500 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0}
.field .opt{text-transform:none;letter-spacing:0;opacity:.8}
.field .tip{font-size:12px;color:var(--muted)}

/* tab bar */
.bar{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;
  padding:12px 14px;background:var(--ink);border:3px solid var(--ink);
  box-shadow:5px 6px 0 rgb(55 33 23 / .18);
}
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-width:0}
#app{width:100%}
.tab{
  display:inline-flex;align-items:center;gap:8px;padding:8px 14px;
  background:var(--paper);border:2px solid var(--ink);border-radius:2px;
  font-weight:600;font-size:14px;cursor:pointer;
  box-shadow:3px 4px 0 rgb(55 33 23 / .16);
}
.tab:hover{border-color:var(--muted)}
.tab .n{
  font:400 12px var(--font-mono);color:var(--muted);
  border-left:1px dashed var(--line);padding-left:10px;margin-left:2px;
}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab[aria-selected="true"] .n{color:inherit;opacity:.75;border-color:currentColor}
.hint{margin:0;font-size:13px;color:var(--ink);text-align:center;font-weight:600}

/* add panel */
.panel{
  display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:20px;margin-top:14px;
  width:100%;background:var(--paper);border:3px solid var(--ink);border-radius:2px;padding:22px;
  box-shadow:7px 8px 0 rgb(55 33 23 / .16);transform:rotate(.4deg);
}
.fields{display:flex;flex-direction:column;gap:14px;min-width:0}
.seg{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
.seg legend{width:100%;margin-bottom:6px}
.seg label{font:600 14px var(--font-body);letter-spacing:0;text-transform:none;color:var(--fg);cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span.opt-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.seg input:checked+span.opt-pill{background:var(--accent-soft);border-color:var(--accent)}
.seg input:focus-visible+span.opt-pill{outline:2px solid var(--accent);outline-offset:2px}
.inline{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;width:fit-content}
.inline input{width:18px;height:18px;accent-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.poster-col{display:flex;flex-direction:column;gap:8px;align-items:center}
.drop{
  position:relative;width:100%;aspect-ratio:2/3;overflow:hidden;cursor:pointer;
  border:3px solid var(--ink);border-radius:2px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop-hint{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;text-align:center;font-size:13px;color:var(--ink)}

/* board */
.board-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:8px 16px;margin-bottom:14px;text-align:center}
.board-head h2{margin:0;font:700 22px/1.2 var(--font-display);letter-spacing:-.01em}
.board-head .sub{font:400 12px var(--font-mono);color:var(--muted);margin-left:10px}
/* ---- scrapbook sheets: ruled paper, torn edges, pinned with a red push pin ----
   The sheet colours stay light in dark mode too, so handwriting is always dark ink on paper. */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,250px));justify-content:center;gap:46px 32px;padding-top:20px}
.card{
  --sheet-ink:#2a1a16;--sheet-accent:#922839;--rule:#b9b6c9;--margin:#d98e98;--hole:#6e1a27;
  --rot:-1deg;--prot:0deg;--brot:2deg;
  position:relative;isolation:isolate;display:flex;flex-direction:column;min-width:0;
  color:var(--sheet-ink);color-scheme:light;
  transform:rotate(var(--rot));transition:transform .18s ease,filter .18s ease;
  filter:drop-shadow(2px 5px 4px rgb(45 26 17 / .3));
}
.card.is-pinned{filter:drop-shadow(3px 9px 6px rgb(45 26 17 / .36))}
@media (hover:hover){.card:hover{transform:rotate(0deg) translateY(-3px)}}

/* crumpled burgundy paper peeking out from behind some sheets */
.card::before{
  content:"";position:absolute;z-index:-2;display:none;
  left:-10px;right:14px;top:30%;bottom:-11px;
  background:url('/assets/scrapbook/crumple.jpg') center/cover;
  transform:rotate(var(--brot));
}
.card.has-back::before{display:block}

/* the sheet: torn top and bottom, with a pale rim where the paper fibres show */
.rim{position:absolute;inset:0;z-index:-1;background:#fffdf7;clip-path:var(--tear-rim,none)}
.sheet{
  position:relative;flex:1;display:flex;flex-direction:column;
  background:url('/assets/scrapbook/grain.png'),linear-gradient(172deg,#faf3e2 0%,#f4eada 55%,#eee1c8 100%);
  clip-path:var(--tear,none);
}
.sheet::before{
  content:"";position:absolute;z-index:0;top:0;bottom:0;left:0;width:30px;pointer-events:none;
  background:radial-gradient(circle at 12px 22px,var(--hole) 0 4.4px,rgb(255 255 255 / .55) 4.6px 5.4px,transparent 5.6px) 0 0/30px 64px repeat-y;
}
.sheet::after{content:"";position:absolute;z-index:0;top:0;bottom:0;left:25px;width:1px;background:var(--margin);pointer-events:none}
.sheet > *{position:relative;z-index:1}

/* the poster, stuck on like a photo print */
.frame{
  margin:34px 14px 12px 34px;padding:5px;background:#fffdf6;
  box-shadow:0 1px 2px rgb(0 0 0 / .4),0 4px 9px rgb(60 30 20 / .2);
  transform:rotate(var(--prot));
}
.poster{position:relative;aspect-ratio:2/3;background:#e6d8bf;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster.empty{display:flex;align-items:center;justify-content:center}
.poster.empty::before,.poster.empty::after{
  content:"";position:absolute;top:0;bottom:0;width:16px;
  background:radial-gradient(circle at 8px 12px,#f6ecd6 0 3.5px,transparent 4px) 0 0/16px 24px repeat-y;
}
.poster.empty::before{left:4px}
.poster.empty::after{right:4px}
.initial{font:800 76px/1 var(--font-display);color:var(--sheet-accent);opacity:.6}
.from{
  position:absolute;left:6px;bottom:6px;max-width:calc(100% - 12px);
  display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:2px;
  background:rgb(255 248 232 / .94);color:var(--sheet-ink);font:400 11px/1.5 var(--font-mono);
  box-shadow:0 1px 2px rgb(0 0 0 / .25);transform:rotate(-1.5deg);
}
.from span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{
  position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:var(--ok);color:var(--ok-ink);
  box-shadow:0 1px 3px rgb(0 0 0 / .35);
}
.stamp{
  position:absolute;right:8px;top:14px;transform:rotate(8deg);
  font:400 12px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;
  color:var(--sheet-accent);border:2px solid currentColor;border-radius:3px;padding:4px 7px;
  background:rgb(255 248 232 / .72);
}
.is-checked .poster img,.is-watched .poster img{filter:grayscale(.75) brightness(.92)}

/* handwriting on the ruled lines */
.lines{
  min-height:48px;padding:0 14px 0 34px;
  background:repeating-linear-gradient(to bottom,transparent 0 23px,var(--rule) 23px 24px);
}
.ctitle{margin:0;font:700 25px/24px var(--font-hand);overflow-wrap:anywhere}
.is-checked .ctitle{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--sheet-accent)}
.cnote{margin:0;font:500 20px/24px var(--font-hand);white-space:pre-wrap;overflow-wrap:anywhere}
.cmeta{margin:0;font:500 18px/24px var(--font-hand)}
.cfoot{margin-top:auto;padding:10px 14px 20px 34px;display:flex;flex-direction:column;gap:8px}
.crow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tick{display:flex;align-items:center;gap:8px;font:700 20px/1 var(--font-hand);min-height:36px;cursor:pointer}
.tick input{width:18px;height:18px;accent-color:var(--sheet-accent);margin:0}
.del{
  min-width:36px;height:36px;padding:0 6px;border-radius:4px;border:1px solid transparent;background:none;
  color:var(--sheet-ink);opacity:.7;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;
}
.del:hover{color:#a52c27;opacity:1}
.del.sure{color:#a52c27;border-color:#a52c27;opacity:1}
.card .btn{width:100%;padding:8px 10px}
.card .btn.ghost{color:var(--sheet-ink);border-color:#a89b84}
.card .btn.ghost:hover{background:rgb(60 40 25 / .08)}

/* the red push pin is the pin button: pressed in when pinned, a faint loose pin when not */
.pin{
  position:absolute;z-index:3;top:-24px;left:50%;margin-left:-22px;width:44px;height:54px;padding:0;
  display:flex;align-items:flex-start;justify-content:center;
  background:none;border:0;border-radius:10px;cursor:pointer;
}
.pin svg{width:34px;height:46px;transform-origin:50% 90%;transition:transform .16s ease,opacity .16s ease,filter .16s ease}
.pin[aria-pressed="true"] svg{transform:rotate(-10deg) translateY(5px)}
.pin[aria-pressed="false"] svg{transform:rotate(26deg) translateY(-6px);opacity:.42;filter:grayscale(.7)}
.pin[aria-pressed="false"]:hover svg,.pin[aria-pressed="false"]:focus-visible svg{transform:rotate(8deg) translateY(-2px);opacity:.95;filter:none}

/* chrome star stickers on the corner of some sheets, and on every watched one */
.star{position:absolute;z-index:2;pointer-events:none;overflow:visible}
.star-lg{width:60px;height:60px;bottom:-20px}
.star-sm{width:34px;height:34px;bottom:-22px}
.stars-left .star-lg{left:-24px;transform:rotate(-12deg)}
.stars-left .star-sm{left:32px;transform:rotate(16deg)}
.stars-right .star-lg{right:-22px;transform:rotate(14deg)}
.stars-right .star-sm{right:34px;transform:rotate(-14deg)}

.empty-state{
  border:1.5px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);
}
.empty-state svg{color:var(--accent)}
.empty-state h3{margin:0;font:700 18px var(--font-display);color:var(--fg)}
.empty-state p{margin:0;max-width:44ch}
#board{width:100%}
#board{
  position:relative;overflow:hidden;padding:34px 24px 40px;
  border:10px solid var(--ink);border-radius:6px;
  background:linear-gradient(rgb(255 255 255 / .12),rgb(255 255 255 / .12)),var(--board);
  box-shadow:0 12px 0 rgb(45 26 17 / .2),0 18px 30px rgb(45 26 17 / .16);
}
#board::before,#board::after{
  content:"";position:absolute;z-index:0;width:12px;height:12px;border-radius:50%;
  background:#e7d8bd;border:1px solid #a18b6d;box-shadow:inset 0 1px 2px #fff,0 2px 3px rgb(45 20 10 / .45);
}
#board::before{top:12px;left:12px}
#board::after{top:12px;right:12px}
#board > *{position:relative;z-index:1}
#board .board-head{color:var(--fg)}
#board .board-head .sub{color:var(--ink)}
#board .empty-state{border-color:var(--line);color:var(--ink)}
#board .empty-state h3{color:var(--fg)}

.toast{
  position:fixed;left:50%;transform:translate(-50%,8px);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  .grid{grid-template-columns:repeat(auto-fit,minmax(200px,260px))}
  .panel{grid-template-columns:minmax(0,1fr)}
  .poster-col{max-width:168px}
  h1{font-size:24px}
  #board{padding:30px 14px 28px;border-width:7px}
}
@media (max-width:760px){

<body>

</svg>
<div class="cinema-decor" aria-hidden="true">
  <div class="cinema-reel reel-a"></div>
  <div class="cinema-reel reel-b"></div>
</div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 12h4M3 16h4M17 8h4M17 12h4M17 16h4"/></svg>
      <h1>Movie Pinboard</h1>
    </div>
    <div id="who" class="who"></div>
  </header>

  <p id="status" class="status" role="status">Loading…</p>

  <!-- Lobby: create or join a room -->
  <section id="lobby" class="lobby" hidden>
    <div>
      <h2>Your room</h2>
      <p class="lede">A room holds one couple’s boards. Pick a room name and a password, then give both to your person.</p>
    </div>
    <div class="switch" role="group" aria-label="Create or join">
      <button type="button" id="mode-create" aria-pressed="true">Create a room</button>
      <button type="button" id="mode-join" aria-pressed="false">Join a room</button>
    </div>
    <form id="lobby-form">
      <div class="field">
        <label for="l-room">Room name</label>
        <input id="l-room" type="text" maxlength="32" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="popcorn-pair" required>
      </div>
      <div class="field">
        <label for="l-pass">Password</label>
        <input id="l-pass" type="password" maxlength="72" autocomplete="new-password" placeholder="At least 6 characters" required>
      </div>
      <div class="field">
        <label for="l-name">Your name</label>

      <button id="l-submit" class="btn" type="submit">Create room</button>

  <!-- The boards -->
  <div id="app" hidden>
    <aside id="room-rail" aria-label="Your rooms">

      <button id="room-add" class="room-add" type="button">+ Join another</button>
    </aside>
    <div class="bar">
      <div id="tabs" class="tabs" role="tablist" aria-label="Boards"></div>
      <button id="add-toggle" class="btn" type="button" aria-expanded="false" aria-controls="panel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add a movie
      </button>

    <form id="panel" class="panel" hidden autocomplete="off">
      <div class="fields">
        <div class="field">
          <label for="f-title">Movie</label>
          <input id="f-title" type="text" maxlength="120" placeholder="Title" required>
        </div>
        <div class="field">
          <label for="f-note">Why this one? <span class="opt">optional</span></label>
          <textarea id="f-note" rows="2" maxlength="300" placeholder="Who’s in it, where to watch, why you think they’d like it"></textarea>
        </div>
        <fieldset class="field seg">
          <legend>Pin it to</legend>
          <label><input type="radio" name="f-for" id="for-a" value="a"><span class="opt-pill"><i class="dot dot-a"></i><b id="for-a-name" style="font-weight:600"></b></span></label>
          <label><input type="radio" name="f-for" id="for-b" value="b"><span class="opt-pill"><i class="dot dot-b"></i><b id="for-b-name" style="font-weight:600"></b></span></label>
        </fieldset>
        <label class="inline"><input type="checkbox" id="f-pin"> Pin to the top of the board</label>
        <div class="row">
          <button id="f-submit" class="btn" type="submit">Pin it</button>
          <button id="f-cancel" class="btn ghost" type="button">Cancel</button>
        </div>
      </div>
      <div class="poster-col">
        <div id="drop" class="drop" tabindex="0" role="button" aria-label="Choose a poster image">
          <img id="f-prev" alt="" hidden>
          <div id="drop-hint" class="drop-hint">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
            <span>Drop, paste or choose a poster</span>
          </div>
        </div>
        <input id="f-file" type="file" accept="image/*" hidden>
        <button id="f-clear" class="link" type="button" hidden>Remove poster</button>
      </div>
    </form>

    <section id="board" style="margin-top:22px" aria-live="polite"></section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
'use strict';

var ICON = {
  pin:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  x:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  film:'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 12h4M3 16h4M17 8h4M17 12h4M17 16h4"/></svg>'
};

var POLL_MS = 5000;

var S = {
  signedIn:false, roomName:'', my:null,
  slots:{a:null,b:null}, rooms:[], movies:[],
  tab:null, focusTab:null, formInit:false,
  confirmId:null, confirmTimer:null,
  renaming:false, img:'', imgBusy:false, saving:false,
  mode:'create', roomPicker:false, sig:'', inflight:false, lastWrite:0
};

function $(id){return document.getElementById(id);}
function h(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function other(s){return s==='a'?'b':'a';}

function savedTab(){
  try{var t=localStorage.getItem('pinboard-tab');if(t==='a'||t==='b'||t==='w')return t;}catch(e){}
  return null;
}
function saveTab(){try{localStorage.setItem('pinboard-tab',S.tab);}catch(e){}}
function rememberLobby(room,name){
  try{
    localStorage.setItem('pinboard-room',room);
    localStorage.setItem('pinboard-name',name);
  }catch(e){}
}
function restoreLobby(){
  try{
    if(!$('l-room').value)$('l-room').value=localStorage.getItem('pinboard-room')||'';
    if(!$('l-name').value)$('l-name').value=localStorage.getItem('pinboard-name')||'';
  }catch(e){}
}

var toastTimer=null;
function toast(msg){
  var t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},3000);
}

async function api(path,opts){
  opts=opts||{};
  var init={method:opts.method||'GET',credentials:'same-origin',headers:{}};
  if(opts.body!==undefined){init.headers['content-type']='application/json';init.body=JSON.stringify(opts.body);}
  var r=await fetch(path,init);
  var data=null;
  try{data=await r.json();}catch(e){}
  if(!r.ok){
    var err=new Error((data&&data.error)||'Something went wrong. Try again.');
    err.status=r.status;throw err;
  }
  return data;
}

/* names */
function nameOf(s){
  var v=S.slots[s];
  if(v&&v.name)return v.name;
  return s===S.my?'You':'Your person';
}
function boardLabel(s){
  if(s===S.my)return 'Your board';
  var v=S.slots[s];
  return v&&v.name?v.name+'’s board':'Their board';
}
function forLabel(s){
  if(s===S.my)return 'You';
  var v=S.slots[s];
  return v&&v.name?v.name:'Your person';
}

/* ---------- loading state ---------- */
function applyState(d){
  S.signedIn=true;
  S.roomName=d.room.name;
  S.my=d.me.slot;
  S.slots={a:null,b:null};
  S.rooms=d.rooms||[];
  d.members.forEach(function(m){S.slots[m.slot]={name:m.name};});
  S.movies=d.movies;
}

async function refresh(force){
  if(S.inflight)return;
  S.inflight=true;
  var startedAt=Date.now();
  try{
    var d=await api('/api/state');
    // A change made while this request was on the wire would be overwritten by older data.
    if(S.lastWrite>startedAt)return;
    var sig=JSON.stringify(d);
    if(force||sig!==S.sig){S.sig=sig;applyState(d);render();}
    $('status').hidden=true;
  }catch(e){
    if(e.status===401){
      var wasSignedIn=S.signedIn;
      S.signedIn=false;S.sig='';if(wasSignedIn)S.mode='join';render();
      if(wasSignedIn)setMode('join');
    }
    else if(!S.signedIn){$('status').hidden=false;$('status').textContent='Could not reach the server. Reload to try again.';}
  }finally{S.inflight=false;}
}

/* ---------- actions ---------- */
function touch(){S.lastWrite=Date.now();}

function findMovie(id){
  for(var i=0;i<S.movies.length;i++)if(S.movies[i].id===id)return S.movies[i];
  return null;
}

// Change the card on screen first, then tell the server. If the server says no, reload the truth.
async function patch(id,fields){
  var m=findMovie(id);if(!m)return;
  Object.keys(fields).forEach(function(k){m[k]=fields[k];});
  if('watched' in fields)m.watchedAt=fields.watched?Date.now():null;
  touch();render();
  try{await api('/api/movies?id='+encodeURIComponent(id),{method:'PATCH',body:fields});}
  catch(e){toast(e.message);}
  touch();
  refresh(true);
}
async function removeMovie(id){
  S.movies=S.movies.filter(function(m){return m.id!==id;});
  touch();render();
  try{await api('/api/movies?id='+encodeURIComponent(id),{method:'DELETE'});}
  catch(e){toast(e.message);}
  touch();
  refresh(true);
}

/* image handling: shrink to a small JPEG before upload */
async function toPoster(file){
  var url=URL.createObjectURL(file);
  try{
    var img=await new Promise(function(res,rej){
      var i=new Image();
      i.onload=function(){res(i);};
      i.onerror=function(){rej(new Error('bad image'));};
      i.src=url;
    });
    var max=560,qs=[0.74,0.62,0.5,0.4];
    for(var k=0;k<qs.length;k++){
      var sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      var w=Math.max(1,Math.round(img.naturalWidth*sc)),ht=Math.max(1,Math.round(img.naturalHeight*sc));
      var c=document.createElement('canvas');c.width=w;c.height=ht;
      var ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,ht);ctx.drawImage(img,0,0,w,ht);
      var out=c.toDataURL('image/jpeg',qs[k]);
      if(out.length<300000)return out;
      max=Math.round(max*0.85);
    }
    throw new Error('too big');
  }finally{URL.revokeObjectURL(url);}
}
async function setImage(file){
  if(!file||!/^image\//.test(file.type)){toast('That file is not an image.');return;}
  S.imgBusy=true;
  try{
    S.img=await toPoster(file);
    $('f-prev').src=S.img;$('f-prev').hidden=false;$('drop-hint').hidden=true;$('f-clear').hidden=false;
  }catch(e){toast('Could not use that image. Try another one.');}
  finally{S.imgBusy=false;}
}
function clearImage(){
  S.img='';$('f-prev').removeAttribute('src');$('f-prev').hidden=true;$('drop-hint').hidden=false;$('f-clear').hidden=true;$('f-file').value='';
}

/* ---------- add form ---------- */
function openPanel(open){
  $('panel').hidden=!open;
  $('add-toggle').setAttribute('aria-expanded',String(open));
  if(open)$('f-title').focus();
}
function selectedFor(){return $('for-b').checked?'b':'a';}
function syncForm(){
  if(!S.my)return;
  if(!S.formInit){$('for-'+other(S.my)).checked=true;S.formInit=true;}
  $('for-a-name').textContent=forLabel('a');
  $('for-b-name').textContent=forLabel('b');
  $('f-submit').textContent='Pin to '+boardLabel(selectedFor());
  $('f-submit').disabled=S.saving;
}
async function addMovie(ev){
  ev.preventDefault();
  var title=$('f-title').value.trim();
  if(!title||S.saving)return;
  if(S.imgBusy){toast('Still preparing the poster. One second.');return;}
  var dest=selectedFor();
  S.saving=true;syncForm();
  try{
    touch();
    await api('/api/movies',{method:'POST',body:{
      title:title,note:$('f-note').value.trim(),image:S.img||null,
      forSlot:dest,pinned:$('f-pin').checked
    }});
    $('f-title').value='';$('f-note').value='';$('f-pin').checked=false;clearImage();
    S.tab=dest;saveTab();
    toast('Pinned to '+boardLabel(dest));
    $('f-title').focus();
  }catch(e){toast(e.message);}
  finally{S.saving=false;touch();await refresh(true);syncForm();}
}

/* ---------- render ---------- */
// The board is rebuilt on every change (and by the 5-second sync), which would drop keyboard focus.
// Controls carry a data-key, and focus goes back to the one that had it.
function render(){
  var a=document.activeElement,key=a&&a.getAttribute?a.getAttribute('data-key'):null;
  renderNow();
  if(key){
    var el=document.querySelector('[data-key="'+key+'"]');
    if(el&&el!==document.activeElement)el.focus({preventScroll:true});
  }
}
function renderNow(){
  $('status').hidden=true;
  var showLobby=!S.signedIn||S.roomPicker;
  $('app').hidden=showLobby;
  $('lobby').hidden=!showLobby;
  $('lobby-cancel').hidden=!S.roomPicker;
  if(showLobby){
    $('who').replaceChildren();
    if(S.mode==='join')restoreLobby();
    return;
  }
  if(!S.renaming)renderWho();
  renderRooms();
  if(S.tab!=='a'&&S.tab!=='b'&&S.tab!=='w')S.tab=savedTab()||S.my;
  syncForm();
  renderHint();
  renderTabs();
  renderBoard();
}

function renderRooms(){
  var el=$('room-list');el.replaceChildren();
  S.rooms.forEach(function(room){
    var b=h('button','room-choice',room.name);
    b.type='button';b.title=room.name;b.setAttribute('aria-current',String(room.name===S.roomName));
    b.onclick=async function(){
      if(room.name===S.roomName)return;
      try{
        await api('/api/auth',{method:'POST',body:{action:'switch',roomId:room.id}});
        S.sig='';await refresh(true);
      }catch(e){toast(e.message);}
    };
    el.append(b);
  });
}

function renderWho(){
  var w=$('who');w.replaceChildren();
  if(!S.my)return;
  if(S.renaming){
    var f=h('form');
    var inp=h('input');inp.type='text';inp.id='rename-input';inp.maxLength=24;inp.value=nameOf(S.my);inp.setAttribute('aria-label','Your name');
    var ok=h('button','btn','Save');ok.type='submit';ok.style.padding='6px 12px';
    var no=h('button','link','Cancel');no.type='button';
    no.onclick=function(){S.renaming=false;renderWho();};
    f.append(inp,ok,no);
    f.onsubmit=async function(e){
      e.preventDefault();
      var n=inp.value.trim();
      if(n){try{await api('/api/auth',{method:'POST',body:{action:'rename',name:n}});}catch(err){toast(err.message);}}
      S.renaming=false;await refresh(true);
    };
    w.append(f);
    inp.focus();inp.select();
    return;
  }
  w.append(h('i','dot dot-'+S.my));
  var s=h('span');s.append('You are ');s.append(h('strong',null,nameOf(S.my)));w.append(s);
  w.append(h('span','room',S.roomName));
  var r=h('button','link','Rename');r.type='button';
  r.onclick=function(){S.renaming=true;renderWho();};
  var o=h('button','link','Sign out');o.type='button';
  o.title='Sign out on this device. Your room membership and boards stay preserved.';
  o.onclick=async function(){
    try{await api('/api/auth',{method:'POST',body:{action:'logout'}});}catch(e){toast(e.message);}
    S.signedIn=false;S.sig='';S.tab=null;S.formInit=false;S.renaming=false;S.mode='join';openPanel(false);render();setMode('join');
  };
  w.append(r,o);
}

function renderHint(){
  var el=$('hint');
  if(!S.slots[other(S.my)]){
    el.hidden=false;
    el.textContent='Your person has not joined yet. Send them the room name “'+S.roomName+'” and the password, and they pick their own name.';
    return;
  }
  el.hidden=true;
}

function countFor(k){
  var n=0;
  for(var i=0;i<S.movies.length;i++){
    var m=S.movies[i];
    if(k==='w'){if(m.watched)n++;}
    else if(!m.watched&&m.forSlot===k)n++;
  }
  return n;
}

function renderTabs(){
  var el=$('tabs');el.replaceChildren();
  var defs=[[S.my,boardLabel(S.my)],[other(S.my),boardLabel(other(S.my))],['w','Watched']];
  defs.forEach(function(d){
    var k=d[0];
    var b=h('button','tab');b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',String(S.tab===k));
    if(k!=='w')b.append(h('i','dot dot-'+k));
    b.append(h('span',null,d[1]));
    b.append(h('span','n',String(countFor(k))));
    b.onclick=function(){S.tab=k;S.focusTab=k;saveTab();render();};
    el.append(b);
    if(S.focusTab===k){b.focus();S.focusTab=null;}
  });
}

function renderBoard(){
  var el=$('board');el.replaceChildren();
  var tab=S.tab,list;
  if(tab==='w'){
    list=S.movies.filter(function(m){return m.watched;}).sort(function(x,y){return (y.watchedAt||0)-(x.watchedAt||0);});
  }else{
    list=S.movies.filter(function(m){return !m.watched&&m.forSlot===tab;}).sort(function(x,y){
      if(!!y.pinned!==!!x.pinned)return y.pinned?1:-1;
      return (y.createdAt||0)-(x.createdAt||0);
    });
  }
  var head=h('div','board-head');
  var left=h('div');
  var title=h('h2',null,tab==='w'?'Watched together':boardLabel(tab));
  var pinned=list.filter(function(m){return m.pinned;}).length;
  var checked=list.filter(function(m){return m.checked&&!m.watched;});
  title.append(h('span','sub',tab==='w'?(list.length+' watched'):(list.length+' to watch'+(pinned?' · '+pinned+' pinned':''))));
  left.append(title);
  head.append(left);
  if(tab!=='w'&&checked.length){
    var bulk=h('button','btn','Move '+checked.length+' checked to Watched');bulk.type='button';
    bulk.onclick=async function(){
      var ids=checked.map(function(m){return m.id;});
      ids.forEach(function(id){var m=findMovie(id);if(m){m.watched=true;m.watchedAt=Date.now();m.pinned=false;}});
      touch();render();
      try{
        for(var i=0;i<ids.length;i++){await api('/api/movies?id='+encodeURIComponent(ids[i]),{method:'PATCH',body:{watched:true,pinned:false}});}
        toast('Moved to Watched');
      }catch(e){toast(e.message);}
      touch();refresh(true);
    };
    head.append(bulk);
  }
  el.append(head);

  if(!list.length){
    var e=h('div','empty-state');
    e.insertAdjacentHTML('beforeend',ICON.film);
    var t,p,partner=S.slots[other(S.my)];
    if(tab==='w'){t='Nothing watched yet';p='Tick a movie off on a board, then move it here. This is your list of movies you watched together.';}
    else if(tab===S.my){t='Nothing pinned for you yet';p=partner?'Ask '+partner.name+' to pin something here, or add a movie yourself with the button above.':'Add a movie with the button above, or wait for your person to pin something here.';}
    else{t='Nothing pinned for '+forLabel(tab)+' yet';p='Pin a movie you want to watch together. Add a poster and a line on why.';}
    e.append(h('h3',null,t),h('p',null,p));
    el.append(e);
    return;
  }
  var g=h('div','grid');
  list.forEach(function(m){g.append(card(m));});
  el.append(g);
}

/* ---------- scrapbook look: the same movie always gets the same tilt, tear and stickers ---------- */
var PIN_SVG='<svg viewBox="0 0 40 52" aria-hidden="true" focusable="false">'
  +'<rect x="19" y="36" width="2.4" height="15" rx="1.2" fill="url(#pinNeedle)"/>'
  +'<ellipse cx="20" cy="37" rx="14" ry="5.2" fill="url(#pinBase)"/>'
  +'<ellipse cx="20" cy="35.6" rx="14" ry="4.6" fill="#e03a4a" opacity=".55"/>'
  +'<path d="M11.5 36C11.5 29 13.5 22 15 16L25 16C26.5 22 28.5 29 28.5 36C25 39 15 39 11.5 36Z" fill="url(#pinBody)"/>'
  +'<ellipse cx="20" cy="16" rx="10" ry="4" fill="#c42535"/>'
  +'<path d="M10 16C10 6 14.5 2 20 2C25.5 2 30 6 30 16C27 19.5 13 19.5 10 16Z" fill="url(#pinDome)"/>'
  +'<path d="M14 14C14 9 16 6 18.5 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"/>'
  +'<path d="M15.5 30C16 26 16.8 22 17.6 19" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".45"/>'
  +'</svg>';
var STAR_SVG='<svg class="star star-lg" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#star"/></svg>'
  +'<svg class="star star-sm" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><use href="#star"/></svg>';

function seeded(id){
  var str=String(id),s=1779033703^str.length,i;
  for(i=0;i<str.length;i++){s=Math.imul(s^str.charCodeAt(i),3432918353);s=s<<13|s>>>19;}
  var a=s>>>0;
  return function(){a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
}
function pct(n){return (Math.round(n*10)/10)+'%';}
// A ragged top and bottom edge (clip-path polygons), plus a slightly larger pale copy for the torn-fibre rim.
function tornEdges(R){
  var sheet=[],rim=[],x=0,y,p,dx;
  for(;;){
    y=2.5+R()*5.5;
    sheet.push(pct(x)+' '+y.toFixed(1)+'px');
    rim.push(pct(x)+' '+(y-2.4).toFixed(1)+'px');
    if(x>=100)break;
    x=Math.min(100,x+4+R()*5);
  }
  for(p=18;p<90;p+=18+R()*14){
    dx=R()*1.6;
    sheet.push((100-dx).toFixed(2)+'% '+pct(p));
    rim.push(Math.min(100,100-dx+0.9).toFixed(2)+'% '+pct(p));
  }
  x=100;
  for(;;){
    y=2.5+R()*5.5;
    sheet.push(pct(x)+' calc(100% - '+y.toFixed(1)+'px)');
    rim.push(pct(x)+' calc(100% - '+(y-2.4).toFixed(1)+'px)');
    if(x<=0)break;
    x=Math.max(0,x-(4+R()*5));
  }
  return {sheet:'polygon('+sheet.join(',')+')',rim:'polygon('+rim.join(',')+')'};
}

function card(m){
  var watched=!!m.watched,checked=!!m.checked&&!watched;
  // Draw every random number in a fixed order so a movie's look never changes when its state does.
  var R=seeded(m.id),rot=R()*4.2-2.1,prot=R()*3-1.5,brot=R()*7-3.5,backRoll=R(),starRoll=R(),sideRoll=R(),edges=tornEdges(R);
  var hasBack=watched||backRoll<.55,hasStars=watched||starRoll<.26;
  var c=h('article','card'+(m.pinned&&!watched?' is-pinned':'')+(checked?' is-checked':'')+(watched?' is-watched':'')
    +(hasBack?' has-back':'')+(hasStars?' has-stars':'')+(sideRoll<.5?' stars-left':' stars-right'));
  c.style.setProperty('--rot',rot.toFixed(2)+'deg');
  c.style.setProperty('--prot',prot.toFixed(2)+'deg');
  c.style.setProperty('--brot',brot.toFixed(2)+'deg');
  c.style.setProperty('--tear',edges.sheet);
  c.style.setProperty('--tear-rim',edges.rim);

  if(!watched){
    var pb=h('button','pin');pb.type='button';pb.innerHTML=PIN_SVG;
    pb.setAttribute('aria-pressed',String(!!m.pinned));
    pb.setAttribute('aria-label',m.pinned?'Unpin '+m.title:'Pin '+m.title);
    pb.title=m.pinned?'Unpin':'Pin to the top';pb.setAttribute('data-key','pin-'+m.id);
    pb.onclick=function(){patch(m.id,{pinned:!m.pinned});};
    c.append(pb);
  }
  var rim=h('div','rim');rim.setAttribute('aria-hidden','true');
  c.append(rim);
  var sheet=h('div','sheet');

  var frame=h('div','frame');
  var po=h('div','poster');
  if(m.hasImage){var im=document.createElement('img');im.src='/api/img?id='+encodeURIComponent(m.id);im.alt='';im.loading='lazy';po.append(im);}
  else{po.classList.add('empty');po.append(h('span','initial',(m.title||'?').trim().charAt(0).toUpperCase()));}
  if(checked||watched){var bd=h('span','badge');bd.innerHTML=ICON.check;po.append(bd);}
  if(watched){var st=h('span','stamp','Watched');st.setAttribute('aria-hidden','true');po.append(st);}
  var by=m.bySlot==='a'||m.bySlot==='b'?m.bySlot:null;
  if(by){
    var fr=h('span','from');fr.append(h('i','dot dot-'+by));
    fr.append(h('span',null,by===S.my?'from you':'from '+nameOf(by)));
    po.append(fr);
  }
  frame.append(po);
  sheet.append(frame);

  var lines=h('div','lines');
  lines.append(h('h3','ctitle',m.title||'Untitled'));
  if(m.note)lines.append(h('p','cnote',m.note));
  if(watched){
    var wd=m.watchedAt?new Date(m.watchedAt):null,d=wd?wd.toLocaleDateString(undefined,wd.getFullYear()===new Date().getFullYear()?{day:'numeric',month:'short'}:{day:'numeric',month:'short',year:'numeric'}):'';
    lines.append(h('p','cmeta',(d?'Watched '+d+' · ':'')+'for '+forLabel(m.forSlot)));
  }
  sheet.append(lines);

  var foot=h('div','cfoot');
  var row=h('div','crow');
  if(watched){
    var back=h('button','btn ghost','Put back');back.type='button';back.setAttribute('data-key','back-'+m.id);
    back.onclick=function(){patch(m.id,{watched:false,checked:false});};
    row.append(back);
  }else{
    var lab=h('label','tick');
    var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!m.checked;cb.setAttribute('data-key','tick-'+m.id);
    cb.onchange=function(){patch(m.id,{checked:cb.checked});};
    lab.append(cb,h('span',null,'Watched it'));
    row.append(lab);
  }
  var dl=h('button','del'+(S.confirmId===m.id?' sure':''));dl.type='button';dl.setAttribute('data-key','del-'+m.id);
  if(S.confirmId===m.id){dl.textContent='Delete?';}
  else{dl.innerHTML=ICON.x;dl.setAttribute('aria-label','Delete '+m.title);}
  dl.onclick=function(){
    if(S.confirmId===m.id){clearTimeout(S.confirmTimer);S.confirmId=null;removeMovie(m.id);return;}
    S.confirmId=m.id;clearTimeout(S.confirmTimer);
    S.confirmTimer=setTimeout(function(){S.confirmId=null;render();},3500);
    render();
  };
  row.append(dl);
  foot.append(row);
  if(checked){
    var mv=h('button','btn','Move to Watched');mv.type='button';mv.setAttribute('data-key','mv-'+m.id);
    mv.onclick=function(){patch(m.id,{watched:true,pinned:false});};
    foot.append(mv);
  }
  sheet.append(foot);
  c.append(sheet);
  if(hasStars)c.insertAdjacentHTML('beforeend',STAR_SVG);
  return c;
}

/* ---------- lobby ---------- */
function setMode(m){
  S.mode=m;
  if(m==='join')restoreLobby();
  $('mode-create').setAttribute('aria-pressed',String(m==='create'));
  $('mode-join').setAttribute('aria-pressed',String(m==='join'));
  $('l-submit').textContent=m==='create'?'Create room':'Join room';
  $('l-pass').autocomplete=m==='create'?'new-password':'current-password';
  $('l-pass').placeholder=m==='create'?'At least 6 characters':'The room’s password';
  $('l-tip').textContent=m==='create'
    ?'Your person picks their own name when they join.'
    :'Your name identifies you in this room. It is remembered on this device so you can sign back in without creating a new person.';
  $('l-err').hidden=true;
}

async function submitLobby(e){
  e.preventDefault();
  var btn=$('l-submit');btn.disabled=true;$('l-err').hidden=true;
  try{
    await api('/api/auth',{method:'POST',body:{
      action:S.mode,room:$('l-room').value,password:$('l-pass').value,name:$('l-name').value
    }});
    rememberLobby($('l-room').value.trim(),$('l-name').value.trim());
    $('l-pass').value='';
    S.roomPicker=false;S.tab=null;S.formInit=false;
    await refresh(true);
  }catch(err){
    $('l-err').textContent=err.message;$('l-err').hidden=false;
  }finally{btn.disabled=false;}
}

/* ---------- wiring ---------- */
function wire(){
  $('mode-create').onclick=function(){setMode('create');};
  $('mode-join').onclick=function(){setMode('join');};
  $('room-add').onclick=function(){S.roomPicker=true;render();setMode('join');};
  $('lobby-cancel').onclick=function(){S.roomPicker=false;render();};
  $('lobby-form').addEventListener('submit',submitLobby);

  $('add-toggle').onclick=function(){openPanel($('panel').hidden);};
  $('f-cancel').onclick=function(){openPanel(false);};
  $('panel').addEventListener('submit',addMovie);
  $('for-a').onchange=$('for-b').onchange=syncForm;

  var drop=$('drop'),file=$('f-file');
  drop.onclick=function(){file.click();};
  drop.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click();}};
  file.onchange=function(){if(file.files[0])setImage(file.files[0]);};
  $('f-clear').onclick=clearImage;
  ['dragenter','dragover'].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.add('over');});});
  ['dragleave','drop'].forEach(function(n){drop.addEventListener(n,function(e){e.preventDefault();drop.classList.remove('over');});});
  drop.addEventListener('drop',function(e){var f=e.dataTransfer&&e.dataTransfer.files[0];if(f)setImage(f);});

  document.addEventListener('paste',function(e){
    if(!S.signedIn||!e.clipboardData)return;
    var files=Array.prototype.slice.call(e.clipboardData.files||[]).filter(function(f){return /^image\//.test(f.type);});
    if(!files.length)return;
    e.preventDefault();
    if($('panel').hidden)openPanel(true);
    setImage(files[0]);
  });

  // Pick up your person's changes every few seconds while the tab is open.
  setInterval(function(){if(!document.hidden&&S.signedIn)refresh(false);},POLL_MS);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.signedIn)refresh(false);});
}

wire();
setMode('create');
refresh(true);
})();
</script>
